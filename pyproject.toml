[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cross-frequency-pullback-recovery"
version = "0.1.0"
description = "A reproducible research toolkit for a cross-frequency pullback-recovery factor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "pyarrow>=15,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cfpr = "cfpr.cli:main"

[project.urls]
Repository = "https://github.com/StephenSuntheGOAT/Cross-Frequency-Pullback-Recovery1"
Issues = "https://github.com/StephenSuntheGOAT/Cross-Frequency-Pullback-Recovery1/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cfpr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
